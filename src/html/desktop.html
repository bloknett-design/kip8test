            <div class="header-right">
                <!-- Кнопка «Что нового» / Справка -->
                <button type="button" id="mobileWhatsNewBtn" class="whats-new-btn" onclick="navigateTo('whats-new')" aria-label="Что нового" title="Обновления и справка"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>

        </div>
    </header>

    <!-- connectionIndicator — скрытый элемент, нужен только для JS-ссылок.
         Кнопка обновления убрана из верхнего бара; обновление — через боковое меню. -->
    <div class="connection-indicator" id="connectionIndicator" style="display:none !important;"
         title="Обновить данные" role="button" aria-label="Обновить данные приложения">
        <svg class="icon-cloud" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 18 a3 3 0 0 1 0-6 a4.5 4.5 0 0 1 8-2 a6 6 0 0 1 7 8 H5z"/>
            <line class="cloud-cross" x1="6" y1="7" x2="19.5" y2="20"/>
        </svg>
        <svg class="icon-refresh" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
            <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
        </svg>
    </div>

    
    <!-- ===== Десктопный верхний бар ===== -->
    <div id="desktopTopBar" class="desktop-top-bar">
        <div class="desktop-top-bar-left">
            <button type="button" id="desktopBurgerBtn" onclick="toggleDesktopSidebar()" aria-label="Меню">
                <svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="desktop-top-bar-brand" onclick="navigateTo('dashboard')">
                <img id="headerLogoDesktop" src="images/logo.png" alt="КИПиА" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">
                <span class="desktop-top-bar-title">КИПиА</span>
            </div>
            <span class="desktop-top-bar-divider"></span>
            <button type="button" class="desktop-top-bar-tab" data-page="calculators" onclick="navigateTo('calculators')">
                <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/></svg>
                <span>Инженерные калькуляторы</span>
            </button>
            <span class="desktop-top-bar-divider"></span>
            <button type="button" class="desktop-top-bar-tab" data-page="docs" onclick="navigateTo('docs')">
                <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                <span>Документация</span>
            </button>
        </div>
        <div class="desktop-top-bar-right">
            <!-- Кнопка «Что нового» / Справка -->
            <button type="button" id="desktopWhatsNewBtn" class="whats-new-btn" onclick="navigateTo('whats-new')" aria-label="Что нового" title="Обновления и справка"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
            <!-- connection indicator перемещается сюда через CSS -->
        </div>
    </div>

    <!-- ===== Десктоп: полноэкранная строка breadcrumbs для detail-панели ===== -->
    <div id="detailBreadcrumbBar">
        <div class="detail-breadcrumb-chevron" onclick="closeDetailPanel()" aria-label="Назад">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </div>
        <div id="detailBreadcrumbContent"></div>
        <!-- Десктоп: фильтры расходомеров в строке крошек (показываются только на странице расходомеров) -->
        <div class="flow-header-filters flow-bc-filters" id="flowBcFilters">
            <button type="button" class="flow-header-filter-btn active" data-flow-filter="all" onclick="FlowUserView.setFilter('all')">Все</button>
            <button type="button" class="flow-header-filter-btn" data-flow-filter="fav" onclick="FlowUserView.setFilter('fav')">Избранное <span class="flow-header-filter-count" id="flowBcFavCount">0</span></button>
            <button type="button" class="flow-header-filter-btn" data-flow-filter="hidden" onclick="FlowUserView.setFilter('hidden')">Скрытые <span class="flow-header-filter-count" id="flowBcHiddenCount">0</span></button>
            <button type="button" class="flow-header-restore-btn" id="flowBcRestoreBtn" onclick="FlowUserView.restoreAll()" style="display:none;">Показать все</button>
        </div>
        <button type="button" class="detail-breadcrumb-close" onclick="closeDetailPanel()" aria-label="Закрыть панель">
            <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:rgba(74,143,199,0.9);fill:none;stroke-width:2;stroke-linecap:round;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <button type="button" class="detail-breadcrumb-swap" onclick="swapDetailPanels()" aria-label="Поменять панели местами" title="Поменять панели местами">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="rgba(74,143,199,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16l-4-4 4-4"/><path d="M17 8l4 4-4 4"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
        </button>
    </div>

    <div id="contentArea">

        <!-- ===== Десктоп: правая панель деталей (master-detail) ===== -->
        <div id="detailPanel">
            <div class="detail-panel-header">
                <div class="detail-panel-title" id="detailPanelTitle">Детали</div>
                <button type="button" id="detailPanelFavBtn" class="dev-fav-header-btn" onclick="KipFav.toggleFromDetailPanel()" aria-label="Избранное" title="Добавить/убрать из избранного" style="display:none;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
                <button type="button" class="detail-panel-close" onclick="closeDetailPanel()" aria-label="Закрыть панель">
                    <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:rgba(74,143,199,0.9);fill:none;stroke-width:2;stroke-linecap:round;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="detail-panel-body" id="detailPanelBody"></div>
            <div class="detail-panel-footer" id="detailPanelFooter"></div>
        </div>
    </div>
</div>
