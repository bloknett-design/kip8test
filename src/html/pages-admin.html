
        <!-- ======================== АДМИН-ПАНЕЛЬ (только роль "Админ") ======================== -->
        <!-- Главная страница админ-панели: 4 карточки-раздела. -->
        <div id="page-admin" class="page-content">
            <div class="page-inline-header"><div class="page-inline-header-chevron" onclick="chevronTap()" aria-label="Назад / Главная"></div><div class="page-inline-header-title">Админ-панель</div></div>

            <div class="admin-grid">
                <div class="admin-card admin-card-users" onclick="navigateTo('admin-users')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <div class="admin-card-text">
                        <div class="admin-card-label">Пользователи</div>
                        <div class="admin-card-sublabel">Список, роли, сброс входа</div>
                    </div>
                    <i class="menu-btn-arrow">›</i>
                </div>
                <div class="admin-card admin-card-sessions" onclick="navigateTo('admin-sessions')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <div class="admin-card-text">
                        <div class="admin-card-label">Сессии</div>
                        <div class="admin-card-sublabel">Активные входы</div>
                    </div>
                    <i class="menu-btn-arrow">›</i>
                </div>
                <div class="admin-card admin-card-logs" onclick="navigateTo('admin-logs')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    <div class="admin-card-text">
                        <div class="admin-card-label">Журнал</div>
                        <div class="admin-card-sublabel">События и действия</div>
                    </div>
                    <i class="menu-btn-arrow">›</i>
                </div>
                <div class="admin-card admin-card-stats" onclick="navigateTo('admin-stats')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    <div class="admin-card-text">
                        <div class="admin-card-label">Статистика</div>
                        <div class="admin-card-sublabel">Сводка по системе</div>
                    </div>
                    <i class="menu-btn-arrow">›</i>
                </div>
            </div>
            <div class="admin-footer">
                <button type="button" class="admin-refresh-btn" onclick="KipAdmin.refreshAll()">Обновить данные</button>
            </div>
        </div>

        <!-- ===== Админ: Пользователи ===== -->
        <div id="page-admin-users" class="page-content">
            <div class="page-inline-header"><div class="page-inline-header-chevron" onclick="chevronTap()" aria-label="Назад / Главная"></div><div class="page-inline-header-title">Пользователи</div></div>
            <div class="admin-toolbar">
                <input type="search" id="adminUserSearch" class="admin-search" placeholder="Поиск по email…" autocomplete="off" enterkeyhint="search" oninput="KipAdmin.renderUsers()">
                <button type="button" class="admin-add-btn" onclick="KipAdmin.openCreateUser()">+ Добавить</button>
                <button type="button" class="admin-refresh-btn" onclick="KipAdmin.loadUsers()">↻</button>
            </div>
            <div id="adminUsersList" class="admin-list">Загрузка…</div>
        </div>

        <!-- ===== Админ: Сессии ===== -->
        <div id="page-admin-sessions" class="page-content">
            <div class="page-inline-header"><div class="page-inline-header-chevron" onclick="chevronTap()" aria-label="Назад / Главная"></div><div class="page-inline-header-title">Активные сессии</div></div>
            <div class="admin-toolbar">
                <input type="search" id="adminSessionSearch" class="admin-search" placeholder="Поиск по email…" autocomplete="off" enterkeyhint="search" oninput="KipAdmin.renderSessions()">
                <button type="button" class="admin-refresh-btn" onclick="KipAdmin.loadSessions()">↻</button>
            </div>
            <div id="adminSessionsList" class="admin-list">Загрузка…</div>
        </div>

        <!-- ===== Админ: Журнал ===== -->
        <div id="page-admin-logs" class="page-content">
            <div class="page-inline-header"><div class="page-inline-header-chevron" onclick="chevronTap()" aria-label="Назад / Главная"></div><div class="page-inline-header-title">Журнал событий</div></div>
            <div class="admin-toolbar">
                <input type="search" id="adminLogSearch" class="admin-search" placeholder="Поиск: email, action…" autocomplete="off" enterkeyhint="search" oninput="KipAdmin.renderLogs()">
                <select id="adminLogFilter" class="admin-select" onchange="KipAdmin.renderLogs()">
                    <option value="">Все действия</option>
                    <option value="LOGIN_SUCCESS">Входы (успех)</option>
                    <option value="LOGIN_FAILED">Входы (сбой)</option>
                    <option value="LOGOUT">Выходы</option>
                    <option value="OTP_REQUESTED">OTP запрошен</option>
                    <option value="OTP_VERIFIED">OTP проверен</option>
                    <option value="ADMIN_UPDATE_ROLE">Смена роли</option>
                    <option value="ADMIN_RESET_LOGIN">Сброс входа</option>
                    <option value="ADMIN_CREATE_USER">Создание пользователя</option>
                    <option value="ADMIN_ACCESS_DENIED">Отказ в доступе</option>
                    <option value="CABLE_JOURNAL_APPEND">Каб. журнал: добавление</option>
                    <option value="CABLE_JOURNAL_UPDATE">Каб. журнал: изменение</option>
                    <option value="CABLE_JOURNAL_DELETE">Каб. журнал: удаление</option>
                    <option value="CABLE_JOURNAL_ACCESS_DENIED">Каб. журнал: отказ в доступе</option>
                    <option value="FLOWMETER_UPDATE_READING">Расходомеры: ввод показаний</option>
                    <option value="FLOWMETER_ACCESS_DENIED">Расходомеры: отказ в доступе</option>
                </select>
                <button type="button" class="admin-refresh-btn" onclick="KipAdmin.loadLogs()">↻</button>
            </div>
            <div id="adminLogsList" class="admin-list">Загрузка…</div>
        </div>

        <!-- ===== Админ: Статистика ===== -->
        <div id="page-admin-stats" class="page-content">
            <div class="page-inline-header"><div class="page-inline-header-chevron" onclick="chevronTap()" aria-label="Назад / Главная"></div><div class="page-inline-header-title">Статистика</div></div>
            <div class="admin-toolbar">
                <button type="button" class="admin-refresh-btn" onclick="KipAdmin.loadStats()">↻ Обновить</button>
            </div>
            <div id="adminStatsContainer" class="admin-stats-container">Загрузка…</div>
        </div>
