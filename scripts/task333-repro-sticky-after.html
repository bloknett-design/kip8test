<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 20px; background: #0e1621; font: 12px sans-serif; color: #e0e0e0; }
  .wrap { width: 500px; overflow-x: auto; height: 120px; }
  table { border-collapse: collapse; }
  td, th { border: 1px solid rgba(255,255,255,0.06); padding: 6px 10px; height: 40px; }
  td.emp { position: sticky; left: 0; z-index: 1; background: #0e1621; white-space: nowrap; }
  /* ВАРИАНТ A: ::after с left:100% */
  td.emp::after { content: ''; position: absolute; left: 100%; top: -1px; bottom: -1px;
                  width: 2px; background: #4a8fc7; pointer-events: none; }
  td.day { background: #eef0f2; color: #141413; width: 60px; text-align: center; }
  .marker { color: #ffd54f; margin-top: 10px; }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <table>
      <tbody>
        <tr>
          <td class="emp" id="emp">ФИО Сотрудника</td>
          <td class="day">1</td><td class="day">2</td><td class="day">3</td><td class="day">4</td>
          <td class="day">5</td><td class="day">6</td><td class="day">7</td><td class="day">8</td>
          <td class="day">9</td><td class="day">10</td><td class="day">11</td><td class="day">12</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="marker" id="info"></div>
  <script>
    function report() {
      var emp = document.getElementById('emp');
      var r = emp.getBoundingClientRect();
      var cs = getComputedStyle(emp, '::after');
      document.getElementById('info').textContent =
        'emp.right=' + r.right.toFixed(1) + ' ::after left=' + cs.left +
        ' width=' + cs.width + ' scrollTop/Left=' + wrap.scrollTop + '/' + wrap.scrollLeft;
    }
    report();
    wrap.addEventListener('scroll', report);
  </script>
</body>
</html>
