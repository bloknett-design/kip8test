name: Deploy GitHub Pages

# Деплой готового PWA из корня репозитория на GitHub Pages.
# В репозитории уже лежит собранный index.html (~29 648 строк, ~1.8 МБ) —
# отдельная сборка через build.mjs не нужна (src/ отсутствует в репо).
#
# Что деплоится: index.html, manifest.json, sw.js, images/, data/, .well-known/
# Не деплоятся: scripts/, tests/, electron/, node_modules/, .git/, *.md

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'images/**'
      - 'data/**'
      - '.well-known/**'
      - '.nojekyll'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Деплоим корень репозитория как есть.
          # Файлы в корне: index.html, manifest.json, sw.js, .well-known/, images/, data/
          # electron/ и scripts/ тоже попадут, но они не влияют на работу PWA.
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
