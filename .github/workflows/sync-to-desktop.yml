name: Sync content to kip8test-desktop

# Автосинхронизация контента из kip8test в kip8test-desktop (тестовый десктоп).
# Синхронизируется ПОЛНЫЙ набор (Task 517 — зеркально механизму kip8):
#   - index.html + десктоп-модули (charts-desktop.js, devices-table-desktop.js)
#     — офлайн-fallback app://
#   - sw.js + scripts/*.gs + scripts/sync-*.py + tests/ (tests/*.js +
#     README.md) — фикстуры полного тестового прогона (CI kip8test-desktop,
#     node tests/run-all.js); в Electron-сборку НЕ попадают (files в
#     package.json: index.html/images/data/electron)
#   - data/*.json + images/*.png + Системный промт — данные/ассеты/документация
# При пуше в main, меняющем index.html/десктоп-модули, workflow:
#   1. Копирует набор в kip8test-desktop
#   2. Чистит мусор зеркала: scripts/DEPLOY-*.md + артефакты Task 345
#      (build.mjs, vite.config.mjs, bun.lock, tests/test-task345.js)
#   3. Коммитит через PAT (секрет DESKTOP_SYNC_TOKEN)
# paths-триггеры НЕ расширять (Task 517): ежедневные авто-коммиты Google
# Sheets (data/*.json) и docs-пуши НЕ должны гонять десктоп-зеркало;
# полный набор протягивается тем же диспатчем/пушем в index.html.
# Аналог механизма kip8 -> kip8-desktop (sync-to-desktop.yml в kip8).

on:
  # Task 542: workflow_dispatch уже был ниже (после paths) — дубль
  # ключа ломал YAML (startup failure). Ручной запуск синка
  # используется, когда пины тестов правятся БЕЗ index.html.
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'charts-desktop.js'
      - 'devices-table-desktop.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-to-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kip8test
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Получить информацию о последнем коммите
        id: commit_info
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "msg=$(git log -1 --pretty=%s | head -c 100)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT

      - name: Клонировать kip8test-desktop
        env:
          DESKTOP_SYNC_TOKEN: ${{ secrets.DESKTOP_SYNC_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${DESKTOP_SYNC_TOKEN}@github.com/bloknett-design/kip8test-desktop.git" /tmp/kip8test-desktop

      - name: Скопировать контент и фикстуры тестов
        run: |
          cp index.html /tmp/kip8test-desktop/index.html
          # Task 147: модуль графиков (только десктоп) — нужен для офлайн-fallback app://
          cp charts-desktop.js /tmp/kip8test-desktop/charts-desktop.js
          # Task 148: таблица приборов (только десктоп)
          cp devices-table-desktop.js /tmp/kip8test-desktop/devices-table-desktop.js
          # Task 517: полный набор фикстур тестового прогона (CI kip8test-desktop)
          cp sw.js /tmp/kip8test-desktop/sw.js
          cp "Системный_промт_для_приложения_КИПиА.md" /tmp/kip8test-desktop/
          mkdir -p /tmp/kip8test-desktop/scripts /tmp/kip8test-desktop/tests \
                   /tmp/kip8test-desktop/data /tmp/kip8test-desktop/images
          cp scripts/*.gs /tmp/kip8test-desktop/scripts/
          cp scripts/sync-*.py /tmp/kip8test-desktop/scripts/
          cp tests/*.js tests/README.md /tmp/kip8test-desktop/tests/
          cp data/*.json /tmp/kip8test-desktop/data/
          cp images/*.png /tmp/kip8test-desktop/images/
          # Task 517: чистка зеркала (курс Task 510 на чистоту репо):
          # - DEPLOY-инструкции в PWA старше недели удаляются — зеркало тоже чистим;
          # - build.mjs / vite.config.mjs / bun.lock / tests/test-task345.js —
          #   артефакты Task 345 (древний срез тестов), полному прогону не нужны.
          rm -f /tmp/kip8test-desktop/scripts/DEPLOY-*.md
          rm -f /tmp/kip8test-desktop/tests/test-task345.js
          # Task 517 v2 (фикс стейджинга удалений): корневые артефакты Task 345
          # убираются git rm --ignore-unmatch — git add в шаге коммита
          # перечисляет пути (scripts/, tests/, data/…) и НЕ стейджит
          # удаления в корне репо, из-за чего build.mjs / vite.config.mjs /
          # bun.lock оставались в зеркале после v1-синка (02028000).
          git -C /tmp/kip8test-desktop rm -q -f --ignore-unmatch \
                build.mjs vite.config.mjs bun.lock

      - name: Проверить, есть ли изменения
        id: changes
        run: |
          cd /tmp/kip8test-desktop
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Нет изменений — пропускаем коммит"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Изменения обнаружены — коммитим"
          fi

      - name: Коммит и пуш в kip8test-desktop
        if: steps.changes.outputs.changed == 'true'
        env:
          DESKTOP_SYNC_TOKEN: ${{ secrets.DESKTOP_SYNC_TOKEN }}
          SOURCE_SHA: ${{ steps.commit_info.outputs.sha }}
          SOURCE_MSG: ${{ steps.commit_info.outputs.msg }}
        run: |
          cd /tmp/kip8test-desktop
          git config user.email "bot@kip8test.local"
          git config user.name "kip-bot"
          git add index.html charts-desktop.js devices-table-desktop.js sw.js \
                  scripts/ tests/ data/ images/ \
                  "Системный_промт_для_приложения_КИПиА.md"
          # Коммит-сообщение: показываем, что это автосинхронизация и из какого SHA
          git commit -m "auto: sync content from kip8test@${SOURCE_SHA}

          Source commit: ${SOURCE_SHA}
          Source message: ${SOURCE_MSG}

          Автоматически синхронизировано через GitHub Action sync-to-desktop.yml"
          git push origin main
          echo "✓ контент синхронизирован в kip8test-desktop"

      - name: Summary
        if: always()
        run: |
          echo "## Sync summary"
          echo ""
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "✅ контент обновлён в kip8test-desktop (source: kip8test@${{ steps.commit_info.outputs.sha }})"
          else
            echo "ℹ️ контент уже был актуален в kip8test-desktop"
          fi
